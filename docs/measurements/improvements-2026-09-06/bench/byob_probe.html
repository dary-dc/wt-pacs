<!DOCTYPE html>
<meta charset="utf-8" />
<title>BYOB reader probe on a WebTransport receive stream</title>
<pre id="out"></pre>
<script type="module">
// Query: wt=<url> hash=<sha256 hex> n=<frames> mode=<byob|default>
// Asks the server for frames 0..n-1 one at a time (RequestFrame), reads each envelope from the
// per-frame or shared uni stream, and counts reads / bytes / time per mode.
const q = new URLSearchParams(location.search);
const wtUrl = q.get("wt"); const hash = q.get("hash"); const n = Number(q.get("n") || 40);
const mode = q.get("mode") || "byob";
const out = (o) => { document.getElementById("out").textContent += JSON.stringify(o) + "\n"; };
const hex = (h) => Uint8Array.from(h.match(/../g).map((b) => parseInt(b, 16)));
const enc = new TextEncoder();
function fod(msg) { const b = enc.encode(JSON.stringify(msg)); const o = new Uint8Array(4 + b.length); new DataView(o.buffer).setUint32(0, b.length, true); o.set(b, 4); return o; }

try {
  const t = new WebTransport(wtUrl, { serverCertificateHashes: [{ algorithm: "sha-256", value: hex(hash) }] });
  await t.ready;
  const bi = await t.createBidirectionalStream();
  const w = bi.writable.getWriter();
  const unis = t.incomingUnidirectionalStreams.getReader();
  let reads = 0, bytes = 0, frames = 0, t0 = performance.now();
  let stream = null, reader = null, byobSupported = null;

  async function nextStream() {
    const { value } = await unis.read();
    stream = value;
    if (mode === "byob") {
      try { reader = stream.getReader({ mode: "byob" }); byobSupported = true; }
      catch (e) { byobSupported = String(e); reader = stream.getReader(); }
    } else reader = stream.getReader();
  }

  // Read exactly `len` bytes into a fresh buffer (BYOB) or via default chunks.
  async function readExact(len) {
    if (reader.constructor.name === "ReadableStreamBYOBReader") {
      let buf = new Uint8Array(len); let filled = 0;
      while (filled < len) {
        const { value, done } = await reader.read(buf.subarray(filled)); reads++;
        if (done) throw new Error("eof");
        filled += value.byteLength; buf = new Uint8Array(value.buffer); // buffer was transferred
      }
      return buf;
    }
    // default reader: accumulate
    const parts = []; let have = 0;
    while (have < len) {
      if (pending.length) { const p = pending.shift(); parts.push(p); have += p.length; continue; }
      const { value, done } = await reader.read(); reads++;
      if (done) throw new Error("eof");
      pending.push(value);
    }
    const outb = new Uint8Array(len); let off = 0;
    for (const p of parts) {
      const take = Math.min(p.length, len - off);
      outb.set(p.subarray(0, take), off); off += take;
      if (take < p.length) pending.unshift(p.subarray(take));
    }
    return outb;
  }
  const pending = [];

  await nextStream().catch(() => {});
  for (let i = 0; i < n; i++) {
    await w.write(fod({ op: "request_frame", frame: i }));
    if (!stream) await nextStream();
    const hdr = await readExact(8);
    const len = new DataView(hdr.buffer, hdr.byteOffset, 4).getUint32(0, false) - 4;
    const body = await readExact(len);
    bytes += body.length; frames++;
    // per-frame mode: stream ends after one frame → next frame needs the next stream
    if (q.get("stream_mode") === "per-frame") { try { await reader.cancel(); } catch {} stream = null; pending.length = 0; }
  }
  const ms = performance.now() - t0;
  out({ mode, reader: reader?.constructor.name, byobSupported, frames, bytes, reads, reads_per_frame: reads / frames, ms: Math.round(ms) });
  globalThis.__rows = [{ mode, reader: reader?.constructor.name, byobSupported, frames, bytes, reads, ms: Math.round(ms) }];
  t.close();
} catch (e) {
  out({ error: String(e && e.stack || e) });
  globalThis.__rows = [{ error: String(e) }];
}
globalThis.__done = true;
</script>
