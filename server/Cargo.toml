[package]
name = "exact-server"
version = "0.1.0"
edition = "2021"
description = "WebTransport exact HTJ2K server — Media-complete (FoD ask-only)"

[lib]
name = "exact_server"
path = "src/lib.rs"

[[bin]]
name = "exact-server"
path = "src/main.rs"

[features]
default = []
telemetry = []

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { version = "4", features = ["derive"] }
fod = { path = "../common/fod" }
frame-envelope = { path = "../common/frame-envelope" }
study-bundle = { path = "../ingest/study-bundle" }
memmap2 = "0.9"
libc = "0.2"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
rustls-pemfile = "2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
time = "0.3"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wtransport = { version = "0.7", default-features = false, features = ["quinn", "ring"] }
