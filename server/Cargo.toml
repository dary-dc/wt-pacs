[package]
name = "exact-server"
version = "0.1.0"
edition = "2021"
description = "WebTransport exact HTJ2K server — Media-complete (FoD ask-only)"

[lib]
name = "exact_server"
path = "src/lib.rs"

[[bin]]
name = "exact-server"
path = "src/main.rs"

[features]
default = ["uring", "crypto-ring"]
telemetry = []
# io_uring for a tile miss. Optional so a build without it still compiles, to the
# pool path -- see docs/disk-access/IMPLEMENTATION.md.
uring = ["dep:io-uring"]
# rustls/quinn crypto provider. `aws-lc-rs` uses AWS-LC's vectorised AES-GCM
# (VAES/AVX-512 where the CPU has it); `ring` is the historical default.
crypto-ring = ["rustls/ring", "wtransport/ring"]
crypto-aws-lc-rs = ["rustls/aws-lc-rs", "wtransport/aws-lc-rs"]
# RFC 8879 certificate compression. Off: it pulls brotli and zlib-rs into the tree and does
# nothing until a peer offers the extension -- docs/proposal-session-open.md §What production adds.
cert-compression = ["rustls/brotli", "rustls/zlib"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { version = "4", features = ["derive"] }
fod = { path = "../common/fod" }
frame-envelope = { path = "../common/frame-envelope" }
study-bundle = { path = "../ingest/study-bundle" }
libc = "0.2"
io-uring = { version = "0.7", optional = true }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wtransport = { version = "0.7", default-features = false, features = ["quinn"] }
# `RttEstimator` reaches the congestion controller but quinn 0.11.11 does not re-export it;
# the version is the one quinn itself resolves, so the types are the same.
quinn-proto = { version = "0.11", default-features = false }

[dev-dependencies]
rcgen = "0.13"
sha2 = "0.10"
time = "0.3"
