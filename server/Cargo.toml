[package]
name = "series-server"
version = "0.1.0"
edition = "2021"
description = "Serves one series' frames over WebTransport, each whole and exact: docs/WIRE.md"

[lib]
name = "series_server"
path = "src/lib.rs"

[[bin]]
name = "series-server"
path = "src/main.rs"

[features]
default = ["uring", "crypto-ring"]
telemetry = []
# io_uring for a tile miss. Optional so a build without it still compiles, to the
# pool path -- see docs/adr/disk-access.md.
uring = ["dep:io-uring"]
crypto-ring = ["rustls/ring", "wtransport/ring"]
# RFC 8879 certificate compression. Off: it pulls brotli and zlib-rs into the tree and does
# nothing until a peer offers the extension -- docs/ARCHITECTURE.md §What production adds.
cert-compression = ["rustls/brotli", "rustls/zlib"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { version = "4", features = ["derive"] }
fod = { path = "../common/fod" }
frame-envelope = { path = "../common/frame-envelope" }
series-bundle = { path = "../common/series-bundle" }
libc = "0.2"
io-uring = { version = "0.7", optional = true }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wtransport = { version = "0.7", default-features = false, features = ["quinn"] }
# The WebSocket path, off unless `--websocket`: docs/WIRE.md §The WebSocket mapping.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# `RttEstimator` reaches the congestion controller but quinn 0.11.11 does not re-export it;
# the version is the one quinn itself resolves, so the types are the same.
quinn-proto = { version = "0.11", default-features = false }

[dev-dependencies]
rcgen = "0.13"
sha2 = "0.10"
time = "0.3"
