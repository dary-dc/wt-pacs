# Outside the workspace: a lab crate, built only by its README's commands.
[package]
name = "metadata-delivery"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
wtransport = { version = "=0.7.2", default-features = false, features = ["quinn", "ring"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# The product's transport, early SETTINGS included: every arm dials the same server.
[patch.crates-io]
wtransport = { path = "../../patched/wtransport" }
quinn-proto = { path = "../../patched/quinn-proto" }
quinn = { path = "../../patched/quinn" }

[profile.release]
lto = "fat"
codegen-units = 1
