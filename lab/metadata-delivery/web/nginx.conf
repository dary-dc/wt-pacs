user root;
worker_processes {workers};
pid {run}/nginx.pid;
error_log {run}/nginx.error.log warn;
worker_rlimit_nofile 20000;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path {run}/body;
    proxy_temp_path {run}/proxy;
    fastcgi_temp_path {run}/fastcgi;
    uwsgi_temp_path {run}/uwsgi;
    scgi_temp_path {run}/scgi;
    keepalive_requests 100000;

    server {
        listen {listen}:443 ssl http2;
        ssl_certificate {cert};
        ssl_certificate_key {key};
        root {web};

        location / {
            add_header Cache-Control no-cache;
        }
        location /files/ {
            gzip_static on;
            add_header Cache-Control no-cache;
        }
        location ~ ^/files/[A-Za-z0-9]+/study\.json$ {
            gzip_static on;
            add_header Cache-Control no-store;
        }
        location /meta/ {
            proxy_pass http://127.0.0.1:8081;
        }
    }
}
