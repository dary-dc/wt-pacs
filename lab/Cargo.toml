# The lab crates no product feature names, apart from the product's lock: docs/lines/coordination.md §Open 6.
# Build from this directory (`cd lab && cargo ...`): .cargo/config.toml puts the binaries in the root's target/.
[workspace]
members = [
    "disk-access-bench",
    "container-bench",
    "window-harness",
    "telemetry-bench",
    "metadata-store",
]
# series-server's lab features name these two, so they stay members of the root workspace.
exclude = ["cc-classify", "server-telemetry"]
resolver = "2"

# The root's, so a lab crate builds series-server as the product does.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
tokio = { version = "1.53", features = ["full"] }

[profile.release]
lto = "fat"
codegen-units = 1

[patch.crates-io]
wtransport = { path = "../patched/wtransport" }
quinn-proto = { path = "../patched/quinn-proto" }
quinn = { path = "../patched/quinn" }
