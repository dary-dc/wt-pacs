[package]
name = "disk-access-bench"
version = "0.1.0"
edition = "2021"
description = "Compare study disk-access arms (mmap / pread / madvise) with shared metrics"

[[bin]]
name = "disk-access-bench"
path = "src/main.rs"

[[bin]]
name = "server_ab"
path = "src/bin/server_ab.rs"

[[bin]]
name = "evict"
path = "src/bin/evict.rs"

[features]
# tokio's io_uring file driver, for the `tokio_fs` arm only. Needs `RUSTFLAGS="--cfg tokio_unstable"`
# as well — the feature alone does not compile it in. Never a product feature.
tokio-uring = ["tokio/io-uring"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
exact-server = { path = "../../server" }
fod = { path = "../../common/fod" }
frame-envelope = { path = "../../common/frame-envelope" }
bytes = { workspace = true }
io-uring = "0.7"
memmap2 = "0.9"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
wtransport = { version = "0.7", default-features = false, features = ["quinn", "ring", "dangerous-configuration"] }
