<!doctype html>
<meta charset="utf-8">
<title>HTJ2K encoder settings</title>
<script type="module">
  import { ARMS, round } from "../../decode/per-frame/drive.js";
  const env = { worker: () => new Worker("/client/downloader/decoder.js", { type: "module" }), channel: () => new MessageChannel() };
  const arms = new Proxy({}, { get: (_, name) => (base) => ({ ...ARMS.htj2k(base), ext: name }) });
  globalThis.run = (opts) => round(env, { base: location.origin, ...opts }, arms);
  globalThis.ready = crossOriginIsolated;
</script>
