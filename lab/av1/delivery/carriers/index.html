<!doctype html>
<meta charset="utf-8">
<title>Profile carriers</title>
<script src="/lab/.av1-build/out/simd-op.js"></script>
<script type="module">
  import { prepare, round } from "./ask.js";
  const get = async (p) => {
    const res = await fetch(`/${p}`);
    if (!res.ok) throw new Error(`${p}: ${res.status}`);
    return new Uint8Array(await res.arrayBuffer());
  };
  globalThis.run = async ({ work, set, r, mutate, arms }) => round({ dav1d: globalThis.Dav1dModule }, await prepare(get, work, set), r, mutate, arms);
  globalThis.ready = true;
</script>
