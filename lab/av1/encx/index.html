<!doctype html>
<meta charset="utf-8">
<title>AV1 ENCX</title>
<script type="module">
  import { ARMS, round } from "../speed/drive.js";
  const kinds = { product: "/client/downloader/decoder.js", encx: "/lab/av1/encx/worker.js" };
  const env = { worker: (kind) => new Worker(kinds[kind], { type: "module" }), channel: () => new MessageChannel() };
  const lib = (base, dir, name) => ({ glue: `${base}/${dir}/${name}.js`, wasm: `${base}/${dir}/${name}.wasm`, dir: `${base}/${dir}` });
  const arm = (name) => (base, set) => set.arms[name] && ({ kind: "encx", ext: name, decoder: {
    ...set.arms[name], width: set.width, height: set.height, channels: set.channels, signed: set.signed, offset: set.offset,
    dav1d: lib(base, "lab/.av1-build/out", "simd"), openjph: lib(base, "lab/decode-bench/vendor/openjph", "openjphjs") } });
  const arms = new Proxy({ htj2k: ARMS.htj2k }, { get: (t, k) => t[k] ?? arm(k) });
  globalThis.run = (opts) => round(env, { base: location.origin, ...opts }, arms);
  globalThis.ready = crossOriginIsolated;
</script>
