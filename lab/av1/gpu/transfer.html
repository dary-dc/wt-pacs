<!doctype html>
<meta charset="utf-8">
<title>WebGPU transfer</title>
<script type="module">
// What a WebGPU decode stage pays to move a frame, before any shader runs: the codestream up, the
// decoded samples back into a buffer the page keeps. lab/av1/gpu/README.md
const hex = async (b) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", b))].map((x) => x.toString(16).padStart(2, "0")).join("");

let device;
const sets = new Map();

globalThis.setup = async ({ sizes, mutate }) => {
  const adapter = await navigator.gpu.requestAdapter();
  device = await adapter.requestDevice({ requiredLimits: { maxBufferSize: adapter.limits.maxBufferSize, maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize } });
  const out = {};
  for (const s of sizes) {
    const samples = new Uint8Array(s.w * s.h * s.bytes);
    let x = (s.w * 2654435761 + s.h) >>> 0;
    for (let i = 0; i < samples.length; i++) { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; samples[i] = x & 0xff; }
    const truth = await hex(samples);
    const codestream = samples.slice(0, Math.ceil(samples.length * s.ratio / 4) * 4);
    // The device holds the frame as a decode stage would leave it; the heap arm reads its copy from wasm memory.
    const decoded = device.createBuffer({ size: samples.length, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
    const input = device.createBuffer({ size: codestream.length, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const staging = device.createBuffer({ size: samples.length, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const held = mutate ? samples.slice() : samples;
    if (mutate) held[held.length >> 1] ^= 1;
    device.queue.writeBuffer(decoded, 0, held);
    const memory = new WebAssembly.Memory({ initial: Math.ceil(samples.length / 65536) });
    new Uint8Array(memory.buffer).set(held);
    await device.queue.onSubmittedWorkDone();
    sets.set(s.name, { s, truth, codestream, decoded, input, staging, memory });
    out[s.name] = truth;
  }
  return out;
};

const arms = {
  async heap({ s, memory }) {
    const frame = new Uint8Array(s.w * s.h * s.bytes);
    frame.set(new Uint8Array(memory.buffer, 0, frame.length));
    return frame;
  },
  async webgpu({ s, codestream, decoded, input, staging }) {
    device.queue.writeBuffer(input, 0, codestream);
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(decoded, 0, staging, 0, staging.size);
    device.queue.submit([enc.finish()]);
    await staging.mapAsync(GPUMapMode.READ);
    const frame = new Uint8Array(s.w * s.h * s.bytes);
    frame.set(new Uint8Array(staging.getMappedRange()));
    staging.unmap();
    return frame;
  },
};

globalThis.time = async ({ name, arm, passes }) => {
  const set = sets.get(name);
  const ms = [];
  let exact = 0;
  for (let p = 0; p < passes; p++) {
    const t0 = performance.now();
    const frame = await arms[arm](set);
    ms.push(performance.now() - t0);
    if (await hex(frame) === set.truth) exact++;
  }
  ms.sort((a, b) => a - b);
  return { ms: ms[ms.length >> 1], exact, passes };
};
globalThis.ready = true;
</script>
