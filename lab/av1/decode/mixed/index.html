<!doctype html>
<meta charset="utf-8">
<title>AV1 MIXDEC</title>
<script type="module">
  import { VARIANTS, round } from "../per-frame/drive.js";
  const env = { worker: () => new Worker("/client/decode/decoder.js", { type: "module" }), channel: () => new MessageChannel() };
  // kK is the payload split at k as the client decodes it today, kKm the same payload mixed; a mixed variant only where the top is over 10 bits.
  const av1 = (name) => (base, set) => {
    const [, k, mixed] = name.match(/^k(\d)(m?)$/);
    const variant = set.variants[`k${k}`];
    if (!variant || (mixed && set.bits - k <= 10)) return null;
    return { kind: "product", ext: variant.ext, decoder: { codec: "av1", mixed: !!mixed, glue: `${base}/lab/.av1-build/out/simd.js`,
      wasm: `${base}/lab/.av1-build/out/simd.wasm`, dir: `${base}/lab/.av1-build/out` } };
  };
  const kinds = new Proxy({}, { get: (_, name) => (name === "htj2k" ? VARIANTS.htj2k : av1(name)) });
  globalThis.run = (opts) => round(env, { base: location.origin, ...opts }, kinds);
  globalThis.ready = crossOriginIsolated;
</script>
