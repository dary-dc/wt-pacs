<!doctype html>
<meta charset="utf-8">
<title>AV1 grey path</title>
<script type="module">
  import { run } from "./page.js";
  globalThis.run = run;
  globalThis.ready = crossOriginIsolated;
  const q = new URLSearchParams(location.search);
  // Firefox has no driver here: firefox.mjs opens the page with ?firefox and takes its rows by POST.
  if (q.has("firefox")) {
    const rows = await run({ frames: q.get("frames"), round: 0, only: ["W2"] }).catch((e) => [{ error: String(e) }]);
    await fetch("/rows", { method: "POST", body: JSON.stringify({ userAgent: navigator.userAgent, isolated: crossOriginIsolated, rows }) });
  }
</script>
