<!DOCTYPE html>
<meta charset="utf-8" />
<title>TextEncoder per call vs shared — Chromium</title>
<pre id="out"></pre>
<script>
const msg = { op: "request_frame", frame: 12345 };
const N = 20000;
const shared = new TextEncoder();
function encodeFresh(m) {
  const body = new TextEncoder().encode(JSON.stringify(m));
  const out = new Uint8Array(4 + body.length);
  new DataView(out.buffer).setUint32(0, body.length, true);
  out.set(body, 4);
  return out;
}
function encodeShared(m) {
  const body = shared.encode(JSON.stringify(m));
  const out = new Uint8Array(4 + body.length);
  new DataView(out.buffer).setUint32(0, body.length, true);
  out.set(body, 4);
  return out;
}
function bench(f) {
  for (let i = 0; i < 2000; i++) f(msg);
  const t0 = performance.now();
  let sink = 0;
  for (let i = 0; i < N; i++) sink += f(msg).length;
  return { us_per_call: (performance.now() - t0) * 1000 / N, sink };
}
const rows = [];
for (let r = 0; r < 3; r++) {
  rows.push({ round: r, fresh_us: bench(encodeFresh).us_per_call, shared_us: bench(encodeShared).us_per_call });
}
globalThis.__rows = rows;
document.getElementById("out").textContent = JSON.stringify(rows, null, 1);
globalThis.__done = true;
</script>
