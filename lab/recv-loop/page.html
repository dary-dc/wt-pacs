<!doctype html>
<meta charset="utf-8">
<title>recv-loop</title>
<script type="module">
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const spawn = () => {
    const w = new Worker("worker.js", { type: "module" });
    const pending = new Map();
    let id = 0;
    w.onmessage = ({ data }) => {
      const { resolve, reject } = pending.get(data.id);
      pending.delete(data.id);
      data.error ? reject(new Error(data.error)) : resolve(data.result);
    };
    w.call = (kind, args = {}, transfer = []) => new Promise((resolve, reject) => {
      pending.set(++id, { resolve, reject });
      w.postMessage({ id, kind, ...args }, transfer);
    });
    return w;
  };

  // merged: one worker; split and split2: the receive loop in a worker of its own. `fold` is split's mutant.
  window.visit = async ({ arm, kind, fps, url, hash, count, mutant, warmMs }) => {
    const view = spawn();
    const recv = arm === "merged" || mutant === "fold" ? view : spawn();
    const canvas = document.body.appendChild(document.createElement("canvas")).transferControlToOffscreen();
    const caps = await view.call("prepare", { canvas }, [canvas]);
    await view.call("go", { load: kind, fps });
    await sleep(warmMs);
    const got = await recv.call("fill", { url, hash, count, mutant });
    const load = await view.call("stop");
    view.terminate();
    recv.terminate();
    return { ...caps, ...got, ...load };
  };
  window.ready = true;
</script>
