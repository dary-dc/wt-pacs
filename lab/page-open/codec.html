<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <!-- ?codec=htj2k|av1 names the series' codec, ?tree=PATH serves client/downloader from PATH (the
       rig's copy of a commit before the client was split into transport/ and decode/), ?pre=1 preloads the AV1 decoder's files as head.js does,
       ?hint=1 adds the series' depth (10) to the decoder config and to the preloads, ?sha= is the source's
       checksum the first frame must hash to. lab/page-open/README.md §Cold round trips by codec -->
  <script>
    const q = new URLSearchParams(location.search);
    const old = q.get("tree");
    const tree = (globalThis.__tree = old ? old + "/client/downloader" : "/client/transport");
    const dec = old ? tree : "/client/decode";
    // As head.js: a preload without CORS is not the module or fetch it stands for, and goes unused.
    const link = (rel, href, as) => document.head.append(Object.assign(document.createElement("link"), { rel, href, crossOrigin: "anonymous" }, as && { as }));
    link("preload", "/wt/dev-transport.json", "fetch");
    link("modulepreload", `${tree}/consumer.js`);
    link("preload", `${tree}/downloader.js`, "script");
    link("preload", `${dec}/decoder.js`, "script");
    link("preload", "/client/transport/ts/dist/session.js", "script");
    if (q.get("codec") === "av1") {
      if (q.get("pre") === "1") {
        const names = old
          ? ["av1.js", "av1-item.js", "av1-frame.js", "decode-av1.js", "wasm-glue.js", "decode-av1-webcodecs.js", "av1-probe.js"]
          : ["av1.js", "av1-payload.js", "av1-frame.js", "av1-dav1d.js", "wasm-glue.js", "av1-webcodecs.js", "av1-probe.js"];
        for (const f of names) {
          link("preload", `${dec}/${f}`, "script");
        }
        const wasm = () => ["js", "wasm"].forEach((x) => link("preload", `/client/decode/wasm/built/dav1d/dav1d.${x}`, "fetch"));
        if (q.get("hint") === "1") import(`${dec}/av1-webcodecs.js`).then((wc) => wc.probe("g10")).then((ok) => ok || wasm(), wasm);
        else wasm();
      }
    } else {
      link("preload", "/client/decode/wasm/built/openjph/openjph.js", "fetch");
      link("preload", "/client/decode/wasm/built/openjph/openjph.wasm", "fetch");
    }
  </script>
  <title>page open — by codec</title>
</head>
<body>
  <div id="log"></div>
  <script type="module">
    const q = new URLSearchParams(location.search);
    const open = (globalThis.__wtpacsOpen = {});
    const mark = (name) => (open[name] ??= Math.round(performance.now() * 10) / 10);
    const log = (s) => (document.getElementById("log").textContent += s + "\n");
    mark("script");

    try {
      const { DownloaderClient } = await import(`${globalThis.__tree}/consumer.js`);
      const cfg = await (await fetch("/wt/dev-transport.json")).json();
      mark("config");
      const decoder = q.get("codec") === "av1"
        ? { codec: "av1", ...(q.get("hint") === "1" && { depth: 10 }), glue: "/client/decode/wasm/built/dav1d/dav1d.js", wasm: "/client/decode/wasm/built/dav1d/dav1d.wasm", dir: "/client/decode/wasm/built/dav1d" }
        : { glue: "/client/decode/wasm/built/openjph/openjph.js", wasm: "/client/decode/wasm/built/openjph/openjph.wasm", dir: "/client/decode/wasm/built/openjph" };
      const c = await DownloaderClient.connect(cfg.wt_url, cfg.cert_sha256, { decoders: 3, decoder });
      mark("session");
      const f = await c.requestExactFrame(0);
      const digest = await crypto.subtle.digest("SHA-256", f.bytes.slice());
      const sha = [...new Uint8Array(digest)].map((x) => x.toString(16).padStart(2, "0")).join("");
      if (sha !== q.get("sha")) throw new Error(`frame 0 hashes to ${sha}, not the source's ${q.get("sha")}`);
      mark("frame");
      log(`${f.info.width}x${f.info.height} exact in ${open.frame} ms`);
      c.close();
    } catch (e) {
      globalThis.__wtpacsError = String(e?.stack || e);
      log("FAILED: " + globalThis.__wtpacsError);
    }
    globalThis.__wtpacsDone = true;
  </script>
</body>
</html>
