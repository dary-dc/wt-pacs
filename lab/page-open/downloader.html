<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <!-- ?dns=ORIGIN resolves the transport's host while the page loads; ?transport=wasm takes the
       WASM client, preloaded as cut 3 preloads the rest; ?meta=URL fetches a series's metadata beside
       the config. lab/page-open/README.md -->
  <script>
    const q = new URLSearchParams(location.search);
    const link = (attrs) => document.head.append(Object.assign(document.createElement("link"), attrs));
    if (q.get("dns")) link({ rel: "dns-prefetch", href: q.get("dns") });
    if (q.get("meta")) link({ rel: "preload", as: "fetch", href: q.get("meta"), crossOrigin: "anonymous" });
    if (q.get("transport") === "wasm") {
      link({ rel: "preload", as: "script", href: "/client/transport/wasm/session-adapter.js" });
      link({ rel: "preload", as: "script", href: "/client/transport/wasm/pkg/transport_wasm.js" });
      link({ rel: "preload", as: "fetch", href: "/client/transport/wasm/pkg/transport_wasm_bg.wasm", crossOrigin: "anonymous" });
    }
  </script>
  <!-- The open is serial without these: each is otherwise discovered one round trip
       later than it could be. lab/page-open/README.md -->
  <link rel="preload" as="fetch" href="/wt/dev-transport.json" />
  <link rel="modulepreload" href="/client/transport/consumer.js" />
  <link rel="preload" as="script" href="/client/transport/downloader.js" />
  <link rel="preload" as="script" href="/client/decode/decoder.js" />
  <link rel="preload" as="script" href="/client/transport/ts/dist/session.js" />
  <link rel="preload" as="script" href="/client/decode/wasm/vendor/openjph/openjphjs.js" />
  <link rel="preload" as="fetch" href="/client/decode/wasm/vendor/openjph/openjphjs.wasm" />
  <title>page open — the downloader</title>
</head>
<body>
  <div id="log"></div>
  <script type="module">
    /**
     * R2's downloader variant: the product's own load path — consumer, downloader worker, decoder
     * pool — and nothing else, so the milestones are the open and not a contract run.
     * lab/page-open/README.md
     */
    import { DownloaderClient } from "/client/transport/consumer.js";

    const open = (globalThis.__wtpacsOpen = {});
    const mark = (name) => (open[name] ??= Math.round(performance.now() * 10) / 10);
    const log = (s) => (document.getElementById("log").textContent += s + "\n");
    mark("script");

    try {
      const q = new URLSearchParams(location.search);
      if (q.get("meta")) fetch(q.get("meta")).then((r) => r.json()).then(() => mark("meta"));
      const cfg = await (await fetch("/wt/dev-transport.json")).json();
      mark("config");
      const c = await DownloaderClient.connect(cfg.wt_url, cfg.cert_sha256, {
        transport: q.get("transport") === "wasm" ? "/client/transport/wasm/session-adapter.js" : undefined,
        decoders: 3,
        decoder: {
          glue: "/client/decode/wasm/vendor/openjph/openjphjs.js",
          wasm: "/client/decode/wasm/vendor/openjph/openjphjs.wasm",
          dir: "/client/decode/wasm/vendor/openjph",
        },
      });
      mark("session");
      const f = await c.requestExactFrame(0);
      mark("frame");
      log(`${f.info.width}x${f.info.height} in ${open.frame} ms`);
      c.close();
    } catch (e) {
      globalThis.__wtpacsError = String(e?.stack || e);
      log("FAILED: " + globalThis.__wtpacsError);
    }
    globalThis.__wtpacsDone = true;
  </script>
</body>
</html>
