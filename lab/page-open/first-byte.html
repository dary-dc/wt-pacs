<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <!-- The open is serial without these: each is otherwise discovered one round trip
       later than it could be. lab/page-open/README.md -->
  <link rel="modulepreload" href="/client/downloader/consumer.js" />
  <link rel="preload" as="script" href="/client/downloader/downloader.js" />
  <link rel="preload" as="script" href="/client/downloader/decoder.js" />
  <link rel="preload" as="script" href="/lab/decode-bench/vendor/openjph/openjphjs.js" />
  <link rel="preload" as="fetch" href="/lab/decode-bench/vendor/openjph/openjphjs.wasm" />
  <script>
    const q = new URLSearchParams(location.search);
    const stage = (globalThis.__stage = q.get("stage") ?? "all");
    globalThis.__wtpacsOpen = {};
    // `inline` and `dial0` take the transport URL from the page, as an inlined config would.
    globalThis.__inline = q.get("wt") && q.get("hash") ? { wt_url: q.get("wt"), cert_sha256: q.get("hash") } : null;
    // These hints are the ones an arm drops, so they are written rather than parsed.
    const hint = (as, href) => document.head.insertAdjacentHTML("beforeend", `<link rel="preload" as="${as}" href="${href}">`);
    if (stage !== "inline" && stage !== "dial0") hint("fetch", "/wt/dev-transport.json");
    if (stage !== "no-r4") hint("script", "/client/transport-ts/dist/session.js");
    // A WebTransport cannot be posted to the downloader's worker, so `dial0` is a probe: when a
    // session dialled from the head is ready, and nothing after it.
    if (stage === "dial0" && globalThis.__inline) {
      globalThis.__dial0 = new WebTransport(globalThis.__inline.wt_url, {
        serverCertificateHashes: [{
          algorithm: "sha-256",
          value: Uint8Array.from(globalThis.__inline.cert_sha256.match(/../g), (h) => parseInt(h, 16)),
        }],
        congestionControl: "low-latency",
      });
    }
  </script>
  <title>first byte — the downloader</title>
</head>
<body>
  <div id="log"></div>
  <script type="module">
    /**
     * The first frame of a study fill, where downloader.html times a single ask: one rung of the
     * ladder in lab/page-open/README.md per `?stage=`. The frame count is told, not fetched.
     */
    import { DownloaderClient } from "/client/downloader/consumer.js";

    const stage = globalThis.__stage;
    const frames = Number(new URLSearchParams(location.search).get("frames") || 12);
    const open = globalThis.__wtpacsOpen;
    const mark = (name) => (open[name] ??= Math.round(performance.now() * 10) / 10);
    const log = (s) => (document.getElementById("log").textContent += s + "\n");

    try {
      const inline = stage === "inline" || stage === "dial0";
      if (inline && !globalThis.__inline) throw new Error(`stage ${stage} needs ?wt= and ?hash=`);
      if (stage === "dial0") {
        await globalThis.__dial0.ready;
        mark("session");
        globalThis.__dial0.close();
      } else {
        await fill(inline);
      }
    } catch (e) {
      globalThis.__wtpacsError = String(e?.stack || e);
      log("FAILED: " + globalThis.__wtpacsError);
    }
    globalThis.__wtpacsDone = true;

    async function fill(inline) {
      const config = inline
        ? Promise.resolve(globalThis.__inline)
        : fetch("/wt/dev-transport.json").then((r) => r.json()).then((c) => (mark("config"), c));
      let first;
      const firstFrame = new Promise((r) => (first = r));
      // Today's page has nothing to hand `connect` until the config is in; R3's does not wait.
      if (stage !== "r3" && stage !== "all") await config;
      const c = await DownloaderClient.connect(
        config.then((v) => v.wt_url),
        config.then((v) => v.cert_sha256),
        {
          decoders: 3,
          fill: [...Array(frames).keys()],
          openAsk: stage === "r1" || stage === "all" || stage === "inline",
          onFrame: (f) => f.frameIndex === 0 && first(f),
          decoder: {
            glue: "/lab/decode-bench/vendor/openjph/openjphjs.js",
            wasm: "/lab/decode-bench/vendor/openjph/openjphjs.wasm",
            dir: "/lab/decode-bench/vendor/openjph",
          },
        },
      );
      mark("session");
      const f = await firstFrame;
      mark("frame");
      log(`${f.info.width}x${f.info.height} in ${open.frame} ms`);
      c.close();
    }
  </script>
</body>
</html>
