<!doctype html>
<meta charset="utf-8">
<script type="module">
const q = new URLSearchParams(location.search);
const hash = Uint8Array.from(q.get("hash").match(/../g), (h) => parseInt(h, 16));
const post = (r) => fetch(q.get("post"), { method: "POST", body: JSON.stringify(r) });
const t0 = performance.now();
const wt = new WebTransport(q.get("wt"), { serverCertificateHashes: [{ algorithm: "sha-256", value: hash }] });
const cap = Number(q.get("cap"));
const timer = setTimeout(() => post({ ok: false, ms: cap, error: "unsettled" }), cap);
wt.ready.then(() => { clearTimeout(timer); post({ ok: true, ms: performance.now() - t0 }); },
  (e) => { clearTimeout(timer); post({ ok: false, ms: performance.now() - t0, error: String(e) }); });
</script>
