[package]
name = "window-harness"
version = "0.1.0"
edition = "2021"
description = "Headless WebTransport client for window-saturation / HoL lab (scaffolding)"

[[bin]]
name = "window-harness"
path = "src/main.rs"

[[bin]]
name = "rebind-probe"
path = "src/bin/rebind_probe.rs"

[features]
# The RFC 8879 decompressor, so the probe can negotiate compression with a server built with
# exact-server's `cert-compression`. docs/proposal-session-open.md §What production adds.
cert-compression = ["rustls/brotli", "rustls/zlib"]

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
fod = { path = "../../common/fod" }
frame-envelope = { path = "../../common/frame-envelope" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
wtransport = { version = "0.7", default-features = false, features = ["quinn", "ring", "dangerous-configuration"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
