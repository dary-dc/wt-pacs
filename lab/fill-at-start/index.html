<body>
  <h1>lab — when the first fill leaves</h1>
  <p>
    <code>?arm=after</code> posts the fill once <code>started</code> comes back;
    <code>?arm=start</code> hands it to <code>connect</code>. <code>?block=300</code> holds the
    page's main thread for 300 ms right after <code>connect()</code> is called, which is where a
    viewer's SDK boot task sits. <code>lab/fill-at-start/run.mjs</code> drives this headless.
  </p>
  <div id="log"></div>
  <script type="module" src="./page.js"></script>
</body>
