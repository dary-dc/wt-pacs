[package]
name = "metadata-store"
version = "0.1.0"
edition = "2021"
description = "Four stores for the parser's metadata groups, timed on what a page open reads"

[dependencies]
anyhow = { workspace = true }
blake3 = "1"
libc = "0.2"
memmap2 = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = { workspace = true }
tar = { version = "0.4", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }
zstd = { version = "0.13", optional = true }

[features]
# `--mode study-db`, out of the gate's build: lab/metadata-store/README.md §The study DB's layout.
study-db = ["dep:tar", "dep:xxhash-rust", "dep:zstd"]
