[package]
name = "update-link"
version = "0.1.0"
edition = "2021"
publish = false
description = "One metadata-only package per fresh connection, HTTP/1.1 over TLS over TCP or HTTP/3 over QUIC, timed to the 201"

# Outside the repo's workspace, as lab/other-clients/h3: its quinn is the crate's own, not the patched one.
[workspace]

[dependencies]
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
