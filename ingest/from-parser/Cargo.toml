[package]
name = "from-parser"
version = "0.1.0"
edition = "2021"
description = "The site's ingest: the parser's directory output to a checked .sbnd"

[[bin]]
name = "from-parser"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
series-bundle = { path = "../../common/series-bundle" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[build-dependencies]
cc = "1"
