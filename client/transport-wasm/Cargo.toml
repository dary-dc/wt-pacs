[package]
name = "transport-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM WebTransport client — Media-complete exact frames"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fod = { path = "../../common/fod" }
frame-envelope = { path = "../../common/frame-envelope" }
futures = { version = "0.3", features = ["std"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Performance",
    "WebTransport",
    "WebTransportOptions",
    "WebTransportHash",
    "WebTransportBidirectionalStream",
    "WebTransportCongestionControl",
    "WebTransportReceiveStream",
    "WebTransportSendStream",
    "ReadableStream",
    "WritableStream",
    "ReadableStreamDefaultReader",
    "WritableStreamDefaultWriter",
] }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error"]
console_error = ["dep:console_error_panic_hook"]
# Vacant feature — telemetry is an external JS seam (ADR). Present so
# `WTPACS_TELEMETRY_BUILD=1` can target pkg-telemetry/ without product code.
telemetry = []
