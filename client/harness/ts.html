<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <title>wt-pacs harness (TypeScript)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    #log { white-space: pre-wrap; font-size: 12px; background: #111; color: #0f0; padding: 1rem; }
    button { margin: 0.25rem; }
    a { margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>wt-pacs harness (TypeScript)</h1>
  <p>
    <a href="/harness/">WASM harness</a>
    Pure TS WebTransport client — same wire as WASM. The run itself lives in <code>shell.js</code>.
  </p>
  <button id="frame0">Frame 0</button>
  <button id="bulk">Bulk 0..2</button>
  <button id="run">Run cell (from query)</button>
  <div id="log"></div>
  <script type="module">
    import { bootShell } from "/harness/shell.js";

    bootShell({
      arm: "transport-ts",
      async loadSession({ telemetry, streamMode, cfg }) {
        if (telemetry) {
          globalThis.__wtpacsArm = "transport-ts";
          globalThis.__wtpacsStreamMode = streamMode;
        }
        // The telemetry entry installs the WebTransport patch before the client module
        // evaluates and returns a wrapped session; the product entry is the product.
        const mod = telemetry
          ? await import("/client/transport-ts/dist/session.telemetry.js")
          : await import("/client/transport-ts/dist/session.js");
        return mod.TransportSession.connect(cfg.wt_url, cfg.cert_sha256);
      },
    });
  </script>
</body>
</html>
