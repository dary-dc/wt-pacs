<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <!-- The open is serial without these: each is otherwise discovered one round trip
       later than it could be. lab/page-open/README.md -->
  <link rel="preload" as="fetch" href="/wt/dev-transport.json" />
  <link rel="modulepreload" href="/harness/shell.js" />
  <link rel="modulepreload" href="/client/transport-ts/dist/session.js" />
  <title>wt-pacs harness (TypeScript)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    #log { white-space: pre-wrap; font-size: 12px; background: #111; color: #0f0; padding: 1rem; }
    button { margin: 0.25rem; }
    a { margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>wt-pacs harness (TypeScript)</h1>
  <p>
    <a href="/harness/">WASM harness</a>
    Pure TS WebTransport client — same wire as WASM. The run itself lives in <code>shell.js</code>.
  </p>
  <button id="frame0">Frame 0</button>
  <button id="bulk">Bulk 0..2</button>
  <button id="run">Run cell (from query)</button>
  <div id="log"></div>
  <script type="module">
    import { bootShell } from "/harness/shell.js";

    const q = new URLSearchParams(location.search);

    // Simulated main-thread contention: `busy` ms of work every 100 ms. The survey's claim is
    // that this is what a Worker removes, so the cell has to contain some.
    const busy = Number(q.get("busy") || 0);
    if (busy > 0) {
      setInterval(() => { const end = performance.now() + busy; while (performance.now() < end); }, 100);
    }

    /** The same session, behind a Worker, over postMessage. Frames cross as transfers. */
    async function workerSession(url, hash, opts) {
      const w = new Worker("/harness/session-worker.js", { type: "module" });
      let next = 0;
      const pending = new Map();
      w.onmessage = (e) => {
        const m = e.data;
        const p = pending.get(m.id);
        if (!p) return;
        pending.delete(m.id);
        m.t === "err" ? p.reject(new Error(m.message)) : p.resolve(m);
      };
      const call = (msg) => new Promise((resolve, reject) => {
        const id = ++next;
        pending.set(id, { resolve, reject });
        w.postMessage({ ...msg, id });
      });
      await call({ t: "connect", url, hash, opts });
      return {
        requestExactFrame: (frame) =>
          call({ t: "ask", frame }).then((m) => ({ frameIndex: m.frameIndex, bytes: m.bytes })),
        close: () => { call({ t: "close" }).catch(() => {}); setTimeout(() => w.terminate(), 50); },
        stats: () => ({}),
      };
    }

    bootShell({
      arm: "transport-ts",
      async loadSession({ telemetry, streamMode, cfg, askWindow }) {
        if (telemetry) {
          globalThis.__wtpacsArm = "transport-ts";
          globalThis.__wtpacsStreamMode = streamMode;
        }
        // The telemetry entry installs the WebTransport patch before the client module
        // evaluates and returns a wrapped session; the product entry is the product.
        const opts = askWindow ? { window: askWindow } : {};
        if (q.get("worker") === "1") return workerSession(cfg.wt_url, cfg.cert_sha256, opts);
        const mod = telemetry
          ? await import("/client/transport-ts/dist/session.telemetry.js")
          : await import("/client/transport-ts/dist/session.js");
        return mod.TransportSession.connect(cfg.wt_url, cfg.cert_sha256, opts);
      },
    });
  </script>
</body>
</html>
