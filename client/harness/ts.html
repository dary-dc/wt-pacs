<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>wt-pacs harness (TypeScript)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    #log { white-space: pre-wrap; font-size: 12px; background: #111; color: #0f0; padding: 1rem; }
    button { margin: 0.25rem; }
    a { margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>wt-pacs harness (TypeScript)</h1>
  <p>
    <a href="/harness/">WASM harness</a>
    Pure TS WebTransport client — same wire as WASM.
  </p>
  <button id="frame0">Frame 0</button>
  <button id="bulk">Bulk 0..2</button>
  <div id="log"></div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const telemetry = params.get("telemetry") === "1";
    const streamMode = params.get("stream_mode") || "shared";
    const cell = params.get("cell") || "ondemand";

    const logEl = document.getElementById("log");
    function log(...a) {
      logEl.textContent += a.join(" ") + "\n";
    }

    async function boot() {
      if (telemetry) {
        globalThis.__wtpacsArm = "transport-ts";
        globalThis.__wtpacsStreamMode = streamMode;
      }
      const mod = telemetry
        ? await import("/client/transport-ts/dist/session.telemetry.js")
        : await import("/client/transport-ts/dist/session.js");
      const { TransportSession } = mod;

      const cfg = await fetch("/wt/dev-transport.json").then((r) => r.json());
      log("connecting", cfg.wt_url, telemetry ? "telemetry=1" : "telemetry=0", "cell=" + cell);
      const session = await TransportSession.connect(cfg.wt_url, cfg.cert_sha256);
      log("connect", cfg.wt_url, telemetry ? "telemetry=1" : "telemetry=0", "cell=" + cell);
      document.getElementById("frame0").onclick = async () => {
        const r = await session.requestExactFrame(0);
        log("frame0 bytes", r.bytes.length, "wire ms", (r.timing.lastChunkMs - r.timing.askMs).toFixed(2));
      };
      document.getElementById("bulk").onclick = async () => {
        const indices = [0, 1, 2];
        const askMs = session.startExactFrames(indices);
        for (const i of indices) {
          const r = await session.waitExactFrame(i, askMs);
          log("bulk", r.frameIndex, r.bytes.length);
        }
      };

      if (telemetry && params.get("autorun") === "1") {
        if (cell === "fill") document.getElementById("bulk").click();
        else document.getElementById("frame0").click();
      }
    }
    boot().catch((e) => log("boot error", e));
  </script>
</body>
</html>
