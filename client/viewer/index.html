<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #view { position: absolute; inset: 0 0 2.2em 0; display: block; width: 100%; height: calc(100% - 2.2em); touch-action: none; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2.2em; display: flex; gap: 0.8em; align-items: center;
    padding: 0 0.6em; background: #111; white-space: nowrap; overflow: hidden; }
  #bar button { font: inherit; }
  #status { overflow: hidden; text-overflow: ellipsis; }
  #mark { position: absolute; top: 0.6em; left: 0.6em; padding: 0.2em 0.5em; border-radius: 3px; display: none; }
  #mark.inexact { display: block; background: #b00; color: #fff; }
  #mark.unchecked { display: block; background: #555; color: #fff; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="mark"></div>
<div id="bar"><button id="cine" type="button">▶ cine</button><span id="status">loading…</span></div>
<script type="module" src="/client/viewer/viewer.js"></script>
</body>
