[workspace]
members = [
    "common/fod",
    "common/frame-envelope",
    "common/series-bundle",
    "server",
    "client/transport/wasm",
    "tools/pack-series",
    "ingest/from-parser",
    "ingest/receiver",
    "tools/check-fastpath",
    "lab/disk-access-bench",
    "lab/container-bench",
    "lab/window-harness",
    "lab/telemetry-bench",
    "lab/cc-classify",
    "lab/server-telemetry",
]
# A bare `cargo build` or `cargo test`: from-parser links ingest/tools.sh's build, the WASM client is wasm-pack's.
default-members = [
    "common/fod",
    "common/frame-envelope",
    "common/series-bundle",
    "server",
    "tools/pack-series",
    "tools/check-fastpath",
    "ingest/receiver",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Measured: docs/transport/transport-conclusions.md §4.
[profile.release]
lto = "fat"
codegen-units = 1

# The server's SETTINGS in its handshake flight: docs/ARCHITECTURE.md §Early SETTINGS.
[patch.crates-io]
wtransport = { path = "patched/wtransport" }
# A server's handshake probe repeats its whole flight: docs/ARCHITECTURE.md §What early SETTINGS cost.
quinn-proto = { path = "patched/quinn-proto" }
# Segments per `sendmsg` capped at 24: docs/transport/transport-conclusions.md §4.
quinn = { path = "patched/quinn" }
