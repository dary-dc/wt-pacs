[workspace]
members = [
    "common/fod",
    "common/frame-envelope",
    "ingest/study-bundle",
    "server",
    "client/transport-wasm",
    "tools/pack-study",
    "tools/check-fastpath",
    "lab/disk-access-bench",
    "lab/window-harness",
    "lab/cold-page-bench",
    "lab/telemetry-bench",
]
resolver = "2"

# Cross-crate inlining of quinn + rustls. Measured −5–8 % server CPU/frame,
# −8–20 % send_us p50, −26 % binary; incremental release rebuild ~3 s → ~37 s.
# See docs/improvements/2026-09-08.md §P1.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
