[workspace]
members = [
    "common/fod",
    "common/frame-envelope",
    "ingest/study-bundle",
    "server",
    "client/transport-wasm",
    "tools/pack-study",
    "tools/check-fastpath",
    "lab/disk-access-bench",
    "lab/window-harness",
    "lab/cold-page-bench",
    "lab/telemetry-bench",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# docs/transport/why-these-changes.md §9 — patches/quinn-0.11.11-mtu-gso.patch
[patch.crates-io]
quinn = { path = "patched/quinn" }
