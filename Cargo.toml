[workspace]
members = [
    "common/fod",
    "common/frame-envelope",
    "ingest/study-bundle",
    "server",
    "client/transport-wasm",
    "client/flight-registry",
    "tools/pack-study",
    "lab/disk-access-bench",
    "lab/window-harness",
    "lab/cold-page-bench",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
